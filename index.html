<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گفتگوی صوتی گروهی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, sans-serif;
            background: #111;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #status-bar {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #aaa;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 20px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }
        .dot.online { background: #4caf50; }
        .dot.connecting { background: #ff9800; }
        .dot.offline { background: #f44336; }

        #mic-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: #2a2a2a;
            color: #888;
            box-shadow: 0 0 0 0 rgba(76, 175, 80, 0);
            outline: none;
        }
        #mic-btn:hover { background: #333; }
        #mic-btn.active {
            background: #1b5e20;
            color: #fff;
            box-shadow: 0 0 0 16px rgba(76, 175, 80, 0.15);
        }
        #mic-btn.active:hover { background: #2e7d32; }
        #mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #label {
            margin-top: 24px;
            font-size: 15px;
            color: #777;
            text-align: center;
            line-height: 1.8;
        }

        #peers-count {
            margin-top: 8px;
            font-size: 13px;
            color: #555;
        }

        #debug-info {
            margin-top: 12px;
            font-size: 11px;
            color: #444;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="status-bar">
        <span class="dot" id="mqtt-dot"></span>
        <span id="mqtt-label">در حال بررسی...</span>
    </div>

    <button id="mic-btn" disabled aria-label="روشن/خاموش کردن میکروفون">
        🎤
    </button>

    <div id="label">
        برای صحبت، دکمه میکروفون را بزنید
        <div id="peers-count">در حال جستجوی اتاق...</div>
        <div id="debug-info"></div>
    </div>

    <script type="module">
        // ✅ استفاده از پکیج رسمی @trystero-p2p/mqtt که هم joinRoom و هم getRelaySockets را export می‌کند
        import { joinRoom, getRelaySockets } from 'https://esm.sh/@trystero-p2p/mqtt';

        const micBtn      = document.getElementById('mic-btn');
        const mqttDot     = document.getElementById('mqtt-dot');
        const mqttLabel   = document.getElementById('mqtt-label');
        const peersCount  = document.getElementById('peers-count');
        const debugInfo   = document.getElementById('debug-info');

        const APP_ID  = 'my-public-voice-chat-v1';
        const ROOM_ID = 'public-room-main';

        const AUDIO_CONSTRAINTS = {
            audio: {
                channelCount: 1,
                sampleRate: 16000,
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        };
        const MAX_AUDIO_BITRATE = 24000;

        let room = null;
        let selfStream = null;
        let isMicOn = false;
        const peerAudios = {};

        function setMicUI(on) {
            micBtn.classList.toggle('active', on);
            micBtn.textContent = on ? '🔴' : '🎤';
            micBtn.setAttribute('aria-pressed', on);
        }

        // ✅ تشخیص دقیق وضعیت اتصال بر اساس سوکت‌های واقعی WebSocket
        function checkConnectionStatus() {
            let sockets = {};
            try {
                sockets = getRelaySockets();
            } catch (e) {
                // اگر getRelaySockets در دسترس نبود
                mqttDot.className = 'dot offline';
                mqttLabel.textContent = 'getRelaySockets در دسترس نیست';
                debugInfo.textContent = 'خطا: ' + e.message;
                return;
            }

            const socketList = Object.values(sockets);
            const total = socketList.length;

            if (total === 0) {
                mqttDot.className = 'dot connecting';
                mqttLabel.textContent = 'هیچ سوکتی وجود ندارد';
                debugInfo.textContent = 'getRelaySockets() آبجکت خالی برگرداند';
                return;
            }

            // شمارش سوکت‌ها بر اساس وضعیت
            let openCount = 0;
            let connectingCount = 0;
            let closedCount = 0;
            const details = [];

            for (const [url, socket] of Object.entries(sockets)) {
                const state = socket.readyState;
                let stateText = '';
                if (state === WebSocket.OPEN) { openCount++; stateText = 'باز'; }
                else if (state === WebSocket.CONNECTING) { connectingCount++; stateText = 'در حال اتصال'; }
                else if (state === WebSocket.CLOSING) { stateText = 'در حال بستن'; }
                else if (state === WebSocket.CLOSED) { closedCount++; stateText = 'بسته'; }
                
                // نمایش نام کوتاه بروکر
                const shortUrl = url.replace('wss://', '').split('/')[0];
                details.push(`${shortUrl}: ${stateText}`);
            }

            // تعیین وضعیت کلی
            if (openCount > 0) {
                mqttDot.className = 'dot online';
                mqttLabel.textContent = `متصل به بروکر (${openCount} از ${total})`;
            } else if (connectingCount > 0) {
                mqttDot.className = 'dot connecting';
                mqttLabel.textContent = `در حال اتصال (${connectingCount} سوکت)`;
            } else {
                mqttDot.className = 'dot offline';
                mqttLabel.textContent = `همه سوکت‌ها بسته (${closedCount})`;
            }

            // نمایش جزئیات در بخش دیباگ
            debugInfo.textContent = details.join(' | ');
        }

        function updatePeersCount() {
            if (!room) return;
            const peers = room.getPeers();
            const n = Object.keys(peers).length;
            peersCount.textContent = n === 0
                ? 'هنوز کسی در اتاق نیست (شما اولین نفر هستید)'
                : `${n} نفر دیگر در اتاق هستند`;
        }

        async function applyBitrateLimit(pc) {
            if (!pc || !pc.getSenders) return;
            for (const sender of pc.getSenders()) {
                if (!sender.track || sender.track.kind !== 'audio') continue;
                try {
                    const params = sender.getParameters();
                    if (!params.encodings || params.encodings.length === 0) {
                        params.encodings = [{}];
                    }
                    params.encodings[0].maxBitrate = MAX_AUDIO_BITRATE;
                    params.encodings[0].dtx = true;
                    params.encodings[0].priority = 'very-low';
                    await sender.setParameters(params);
                } catch (e) {
                    console.warn('setParameters failed:', e);
                }
            }
        }

        async function limitAllBitrates() {
            if (!room) return;
            const peers = room.getPeers();
            for (const pc of Object.values(peers)) {
                await applyBitrateLimit(pc);
            }
        }

        async function initRoom() {
            try {
                room = joinRoom({ appId: APP_ID }, ROOM_ID);

                // ✅ هر ۲ ثانیه وضعیت واقعی سوکت‌ها را بررسی کن
                setInterval(checkConnectionStatus, 2000);
                setTimeout(checkConnectionStatus, 500);

                room.onPeerJoin = async (peerId) => {
                    checkConnectionStatus();
                    updatePeersCount();

                    if (selfStream) {
                        room.addStream(selfStream, peerId);
                    }

                    setTimeout(async () => {
                        const peers = room.getPeers();
                        if (peers[peerId]) await applyBitrateLimit(peers[peerId]);
                    }, 1500);
                };

                room.onPeerLeave = (peerId) => {
                    if (peerAudios[peerId]) {
                        peerAudios[peerId].srcObject = null;
                        peerAudios[peerId].remove();
                        delete peerAudios[peerId];
                    }
                    updatePeersCount();
                };

                room.onPeerStream = (stream, peerId) => {
                    if (!peerAudios[peerId]) {
                        const audio = document.createElement('audio');
                        audio.autoplay = true;
                        audio.playsInline = true;
                        audio.style.display = 'none';
                        document.body.appendChild(audio);
                        peerAudios[peerId] = audio;
                    }
                    peerAudios[peerId].srcObject = stream;
                    updatePeersCount();
                };

                micBtn.disabled = false;

            } catch (err) {
                mqttLabel.textContent = 'خطا در اتصال به اتاق';
                mqttDot.className = 'dot offline';
                debugInfo.textContent = err.message;
                console.error(err);
                micBtn.disabled = true;
            }
        }

        async function turnMicOn() {
            if (!room) return;
            try {
                selfStream = await navigator.mediaDevices.getUserMedia(AUDIO_CONSTRAINTS);
                await room.addStream(selfStream);
                isMicOn = true;
                setMicUI(true);
                setTimeout(limitAllBitrates, 1000);
            } catch (err) {
                console.error(err);
                alert('دسترسی به میکروفون ممکن نشد. مطمئن شوید صفحه را روی HTTPS یا localhost باز کرده‌اید.');
                isMicOn = false;
                setMicUI(false);
            }
        }

        function turnMicOff() {
            if (!room || !selfStream) return;
            room.removeStream(selfStream);
            selfStream.getTracks().forEach(t => t.stop());
            selfStream = null;
            isMicOn = false;
            setMicUI(false);
        }

        micBtn.addEventListener('click', () => {
            if (isMicOn) turnMicOff();
            else turnMicOn();
        });

        initRoom();
    </script>
</body>
</html>
