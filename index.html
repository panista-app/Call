<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گفتگوی صوتی گروهی (MQTT + WebRTC)</title>
    <style>
        body { font-family: Tahoma, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #fff; font-family: inherit; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #joinBtn { background: #4CAF50; color: white; border: none; }
        #leaveBtn { background: #f44336; color: white; border: none; }
        #status { margin: 1rem 0; padding: 10px; background: #e3f2fd; border-radius: 6px; min-height: 20px; }
        #peers { margin-top: 1rem; }
        .peer { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        .peer-id { font-family: monospace; font-size: 0.9em; color: #555; margin-right: 10px; }
        .peer-status { font-size: 0.8em; padding: 2px 6px; border-radius: 10px; background: #fff3e0; color: #e65100; }
        .peer-status.connected { background: #e8f5e9; color: #2e7d32; }
        #log { margin-top: 1rem; font-size: 0.8em; color: #666; max-height: 150px; overflow-y: auto; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>🎙️ گفتگوی صوتی گروهی</h1>
    <p>سیگنالینگ با <strong>MQTT</strong> انجام می‌شود؛ صدا مستقیماً بین مرورگرها با <strong>WebRTC</strong> جریان می‌یابد.</p>
    
    <div>
        <label>اتاق: <input type="text" id="roomInput" value="گفتگوی-آزمایشی" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;"></label>
        <button id="joinBtn">ورود به اتاق</button>
        <button id="leaveBtn" disabled>خروج</button>
    </div>

    <div id="status">آماده برای اتصال.</div>
    <div id="peers"><strong>افراد حاضر:</strong><div id="peerList"></div></div>
    <div id="log"></div>

    <script type="module">
        // استفاده از استراتژی MQTT کتابخانه Trystero
        // این کتابخانه به طور خودکار از بروکرهای عمومی MQTT برای تبادل SDP استفاده می‌کند
        import { joinRoom } from 'https://esm.run/trystero/mqtt';

        const joinBtn = document.getElementById('joinBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const roomInput = document.getElementById('roomInput');
        const statusDiv = document.getElementById('status');
        const peerListDiv = document.getElementById('peerList');
        const logDiv = document.getElementById('log');

        let room = null;
        let selfStream = null;
        const peerAudios = {}; // ذخیره المان‌های صوتی هر همتا
        const peerStatus = {}; // وضعیت اتصال هر همتا

        function log(msg) {
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updatePeerUI(peerId, connected) {
            peerStatus[peerId] = connected;
            renderPeerList();
        }

        function renderPeerList() {
            peerListDiv.innerHTML = '';
            const ids = Object.keys(peerStatus);
            if (ids.length === 0) {
                peerListDiv.innerHTML = '<span style="color:#999;">هنوز کسی وارد نشده.</span>';
                return;
            }
            for (const id of ids) {
                const div = document.createElement('div');
                div.className = 'peer';
                div.innerHTML = `
                    <span class="peer-id">${id.slice(0, 8)}...</span>
                    <span class="peer-status ${peerStatus[id] ? 'connected' : ''}">
                        ${peerStatus[id] ? 'متصل (صدا برقرار)' : 'در حال اتصال...'}
                    </span>
                `;
                peerListDiv.appendChild(div);
            }
        }

        async function start() {
            const roomId = roomInput.value.trim();
            if (!roomId) return alert('نام اتاق را وارد کنید.');

            joinBtn.disabled = true;
            leaveBtn.disabled = false;
            statusDiv.textContent = 'در حال اتصال به بروکر MQTT و دریافت میکروفون...';

            try {
                // ۱. دریافت دسترسی به میکروفون
                selfStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                log('میکروفون فعال شد.');

                // ۲. اتصال به اتاق از طریق MQTT (سیگنالینگ)
                // Trystero به طور خودکار به چند بروکر عمومی MQTT متصل می‌شود[reference:2]
                room = joinRoom({ appId: 'my-voice-chat-app' }, roomId);
                log(`به اتاق "${roomId}" متصل شدید.`);

                // ۳. ارسال استریم صوتی خود به همه افراد حاضر در اتاق
                room.addStream(selfStream);

                // ۴. اگر فرد جدیدی وارد شد، استریم خود را برای او هم بفرست
                room.onPeerJoin(peerId => {
                    log(`👤 فرد جدیدی وارد شد: ${peerId.slice(0, 8)}...`);
                    updatePeerUI(peerId, false);
                    room.addStream(selfStream, peerId);
                });

                // ۵. مدیریت استریم صوتی دریافتی از دیگران
                room.onPeerStream((stream, peerId) => {
                    log(`🔊 استریم صوتی از ${peerId.slice(0, 8)}... دریافت شد.`);
                    // اگر قبلاً المان صوتی برای این فرد ساخته نشده، بساز
                    if (!peerAudios[peerId]) {
                        const audio = new Audio();
                        audio.autoplay = true;
                        peerAudios[peerId] = audio;
                    }
                    peerAudios[peerId].srcObject = stream;
                    updatePeerUI(peerId, true);
                });

                // ۶. مدیریت خروج افراد
                room.onPeerLeave(peerId => {
                    log(`👋 فرد خارج شد: ${peerId.slice(0, 8)}...`);
                    if (peerAudios[peerId]) {
                        peerAudios[peerId].srcObject = null;
                        delete peerAudios[peerId];
                    }
                    delete peerStatus[peerId];
                    renderPeerList();
                });

                statusDiv.textContent = '✅ متصل به اتاق. در حال گوش دادن...';
                log('اتاق آماده است.');

            } catch (err) {
                log('خطا: ' + err.message);
                statusDiv.textContent = '❌ خطا در اتصال. مطمئن شوید HTTPS فعال است (یا از localhost استفاده می‌کنید).';
                joinBtn.disabled = false;
                leaveBtn.disabled = true;
                if (selfStream) {
                    selfStream.getTracks().forEach(t => t.stop());
                    selfStream = null;
                }
            }
        }

        function stop() {
            if (room) {
                room.leave();
                room = null;
            }
            if (selfStream) {
                selfStream.getTracks().forEach(t => t.stop());
                selfStream = null;
            }
            // پاک‌سازی صداهای دریافتی
            Object.values(peerAudios).forEach(a => { a.srcObject = null; });
            for (const k in peerAudios) delete peerAudios[k];
            for (const k in peerStatus) delete peerStatus[k];
            renderPeerList();
            joinBtn.disabled = false;
            leaveBtn.disabled = true;
            statusDiv.textContent = 'از اتاق خارج شدید.';
            log('اتاق را ترک کردید.');
        }

        joinBtn.addEventListener('click', start);
        leaveBtn.addEventListener('click', stop);
    </script>
</body>
</html>
